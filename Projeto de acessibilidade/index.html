<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acessibilidade Pedagógica - IA & GeoGebra</title>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #ggb-element { margin: 0 auto; border: 2px solid #ccc; }
        .controls { margin-top: 20px; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        #status { color: #555; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>
    <h1>Interface de Voz para Docentes (STEM)</h1>
    <div id="ggb-element"></div>

    <div class="controls">
        <button id="start-btn">🎤 Iniciar Comando de Voz</button>
        <p id="status">Aguardando comando...</p>
    </div>

    <script>
        // Inicialização do GeoGebra [cite: 30]
        var params = { "appName": "graphing", "width": 800, "height": 600, "showAlgebraInput": true };
        var applet = new GGBApplet(params, true);
        window.onload = () => applet.inject('ggb-element');

        const btn = document.querySelector('#start-btn');
        const status = document.querySelector('#status');

        // Captura de Voz e Integração [cite: 18, 21]
        function startRecognition() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'pt-BR';
            recognition.start();

            recognition.onresult = async (event) => {
                const transcript = event.results[0][0].transcript;
                status.textContent = "Processando: " + transcript;

                try {
                    // Envia para o Backend Python [cite: 47]
                    const response = await fetch('http://127.0.0.1:5000/traduzir', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ texto: transcript })
                    });
                    
                    const data = await response.json();
                    
                    if (data.comando) {
                        ggbApplet.evalCommand(data.comando); // Executa no GeoGebra [cite: 30]
                        falarFeedback("Desenhando " + transcript); // Feedback Auditivo [cite: 33]
                    }
                } catch (err) {
                    status.textContent = "Erro na conexão com a IA.";
                }
            };
        }

        function falarFeedback(msg) {
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.lang = 'pt-BR';
            window.speechSynthesis.speak(utterance);
        }

        btn.onclick = startRecognition;
    </script>
</body>
</html>
