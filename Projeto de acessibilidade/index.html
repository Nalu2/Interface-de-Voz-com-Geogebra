<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acessibilidade Pedagógica - IA & GeoGebra</title>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Interface de Voz para Docentes STEM</h1>
<div id="ggb-element"></div>

<div class="controls">
    <button id="start-btn">🎤 Iniciar Comando de Voz</button>

    <div class="caixa" aria-live="polite">
        <small>Ouvido agora</small>
        <div id="transcricao-ao-vivo">Aguardando...</div>
    </div>

    <p id="status" role="status">Aguardando comando...</p>

    <div class="caixa">
        <small>Histórico</small>
        <ul id="historico-lista"></ul>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
